 new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:false}),m)}\nfunction buildJet(){const g=new THREE.Group(),yel=mat(0xffc400,{side:THREE.DoubleSide,metalness:.3}),body=mat(0xd5d9e3,{metalness:.6,roughness:.3});\n const fu=new THREE.Mesh(new THREE.CylinderGeometry(.2,.3,2.6,20),body);fu.rotation.z=-Math.PI/2;g.add(fu);\n const ns=new THREE.Mesh(new THREE.ConeGeometry(.2,.9,20),body);ns.rotation.z=-Math.PI/2;ns.position.x=1.75;g.add(ns);\n const w=ext([[.7,0],[-.9,1.9],[-1.3,1.9],[-1.1,0]],.07,yel);w.rotation.x=Math.PI/2;g.add(w);const w2=w.clone();w2.scale.y=-1;g.add(w2);\n const fin=ext([[-1.0,.1],[-1.45,1.0],[-1.8,1.0],[-1.5,.1]],.05,yel);fin.position.z=-.025;g.add(fin);\n const cp=new THREE.Mesh(new THREE.SphereGeometry(.22,18,12),mat(0x2b6cb0,{metalness:.9,roughness:.1}));cp.scale.set(1.8,.7,.8);cp.position.set(.6,.22,0);g.add(cp);\n const fl=new THREE.Mesh(new THREE.ConeGeometry(.15,1.1,12),new THREE.MeshBasicMaterial({color:0xff8a1f}));fl.rotation.z=Math.PI/2;fl.position.x=-2.2;g.add(fl);return g}\nconst N=12,FAIL=.2,MU=Array.from({length:N+1},(_,k)=>k==0?1:+(0.96/Math.pow(1-FAIL,k)).toFixed(2));let pos=0,bet=0,active=false,dead=false;\nconst S=mk3('c3',.8,42,[0,4,6.5],[1,0,0]),pads=[],fg=new THREE.Group();\nconst wt=new THREE.Mesh(new THREE.PlaneGeometry(90,30),mat(0x1b7fa6,{roughness:.2,metalness:.3}));wt.rotation.x=-Math.PI/2;wt.position.y=-.1;S.sc.add(wt);\nconst pp=k=>new THREE.Vector3(k*1.5,.1,Math.sin(k*.9)*1.3);\nfor(let k=0;k<=N;k++){const p=new THREE.Mesh(new THREE.CylinderGeometry(.6,.62,.14,24),mat(k==0?0xd9b36a:0x3fbf55));p.position.copy(pp(k));S.sc.add(p);pads.push(p);const t=pl(txt(k==0?'START':MU[k]+'x','#fff',null,k==0?34:46,128,64),1,.5);t.rotation.x=-Math.PI/2;t.position.set(p.position.x,.09,p.position.z+.05);p.add(t);t.position.set(0,.09,0)}\nconst gm=mat(0x4cc95a,{roughness:.5}),bd=new THREE.Mesh(new THREE.SphereGeometry(.38,16,12),gm),hd=new THREE.Mesh(new THREE.SphereGeometry(.26,16,12),gm);bd.scale.set(1,.75,1.2);hd.position.set(.35,.18,0);fg.add(bd,hd);\n[.12,-.12].forEach(z=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.08,10,10),mat(0xffffff));e.position.set(.5,.35,z);const q=new THREE.Mesh(new THREE.SphereGeometry(.04,8,8),mat(0x111111));q.position.set(.57,.36,z);fg.add(e,q)});\nfg.position.copy(pp(0)).setY(.35);S.sc.add(fg);\nS.loop(ts=>{if(!dead)fg.rotation.z=Math.sin(ts/300)*.03});\nfunction hopTo(k,sink){const p=pp(k),f0=fg.position;fg.rotation.y=0;S.go(f0,{x:p.x,z:p.z},380);S.go(f0,{y:1.2},190,()=>S.go(f0,{y:sink?.2:.35},190,()=>{if(sink){S.burst(f0.clone(),[0x9fe0ff,0xffffff],35,3);S.go(f0,{y:-1.4},450)}}));S.go(S.la,{x:p.x+1},400);S.go(S.cam.position,{x:p.x},400)}\nfunction draw(){pads.forEach((p,k)=>p.material.color.setHex(k==0?0xd9b36a:k<pos?0x778899:k==pos?0x7dff8a:0x3fbf55));\n if(pos==0&&!dead){fg.position.copy(pp(0)).setY(.35);S.la.set(1,0,0);S.cam.position.x=0}else hopTo(dead?pos+1:pos,dead)}\nfunction upd2(){upd();const a=+$('amt').value||0;$('mult').textContent=f(MU[pos])+'x';$('cash').disabled=!(active&&pos>=1);$('cash').textContent=f(bet*MU[pos])+' Cashout';$('go').textContent=active?'Hop! (risk '+Math.round(FAIL*100)+'%)':'Start'}\nfunction end(win){active=false;hist(win?f(MU[pos])+'x':'\u2716',win?'w':'l');upd2()}\nfunction go(){if(!active){const a=getBet();if(!a)return;FX.coin();bet=a;bal-=a;pos=0;dead=false;active=true;msg('Hop karo ya cashout!');draw();upd2();return}\n if(Math.random()<FAIL){dead=true;FX.splash();setTimeout(()=>FX.lose(),150);draw();msg('Splash! Frog paani me gir gaya \u2212'+f(bet),'#ff7a88');end(false);return}\n pos++;FX.hop();draw();if(pos==N){FX.win();bal+=bet*MU[pos];S.burst(fg.position.clone(),[0xffd93b,0xffffff],40,4);msg('Paar ho gaye! +'+f(bet*MU[pos]-bet),'#3ddc7a');end(true);return}upd2()}\nfunction cash(){if(!active||pos<1)return;const w=bet*MU[pos];bal+=w;FX.win();msg('Cashout! +'+f(w-bet),'#3ddc7a');end(true)}\n$('amt').addEventListener('input',upd2);draw();upd2();\n<\/script><\/body><\/html>"}, "andar": {"title": "Andar Bahar", "html": "<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Andar Bahar \u2013 Free Play<\/title>\n<style>\n:root{--bg:#0b2a1c;--y:#ffd93b;--mut:#8fc4a6}\n*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}\nhtml,body{background:#000;color:#fff}\n#app{max-width:430px;margin:0 auto;min-height:100vh;background:radial-gradient(circle at 50% 30%,#14663f,var(--bg) 70%);padding:env(safe-area-inset-top,0px) 12px calc(18px + env(safe-area-inset-bottom,0px))}\n.top{text-align:center;padding:16px 0 8px;font-size:22px;font-weight:800;letter-spacing:1px}.top b{color:var(--y)}\n.bal{margin:6px auto 12px;width:max-content;background:#0007;border-radius:20px;padding:7px 18px;font-weight:700}\n.lane{background:#0a3a24;border:2px solid #1c7a4c;border-radius:16px;padding:8px;min-height:92px;position:relative}\n.lane h4{font-size:12px;letter-spacing:2px;color:var(--mut);margin-bottom:4px}\n.lane.win{border-color:var(--y);box-shadow:0 0 18px #ffd93b88}\n.cards{display:flex;flex-wrap:wrap;gap:3px}\n.card{width:30px;height:42px;background:#fff;border-radius:5px;color:#111;font-weight:800;font-size:12px;line-height:1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:pop .25s ease-out}\n.card.red{color:#d11a2a}.card.hit{outline:3px solid var(--y);transform:scale(1.15)}\n@keyframes pop{from{transform:translateY(-20px) scale(.5);opacity:0}to{transform:none;opacity:1}}\n.mid{display:flex;justify-content:center;align-items:center;gap:12px;margin:12px 0}\n.joker{width:62px;height:88px;border-radius:9px;background:#fff;color:#111;font-weight:900;font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--y),0 6px 14px #0008}\n.joker.red{color:#d11a2a}.joker.back{background:repeating-linear-gradient(45deg,#7a1630,#7a1630 6px,#a02045 6px,#a02045 12px);color:#fff}\n.mid small{color:var(--mut);font-size:12px;max-width:110px}\n#msg{text-align:center;height:26px;font-weight:800;font-size:18px;margin-bottom:8px}\n.ctl{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}\n.ctl button{height:36px;min-width:40px;padding:0 10px;border-radius:10px;border:0;background:#1f6b46;color:#fff;font-size:16px}\n.ctl input{width:90px;text-align:center;background:#07180f;border:1px solid #2a7a52;color:#fff;border-radius:10px;height:36px;font-size:16px}\n.row{display:flex;gap:10px}\n.bt{flex:1;border:0;border-radius:16px;padding:14px 0;font-size:20px;font-weight:900}\n.bt small{display:block;font-size:13px;font-weight:600;opacity:.8}\n#bA{background:#ff9a3b;color:#2a1200}#bB{background:#4fb3ff;color:#06203a}\n.bt:disabled{opacity:.45}\n.hist{display:flex;gap:6px;margin-top:14px;overflow:hidden;min-height:30px}\n.chip{border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}\n.ca{background:#ff9a3b;color:#2a1200}.cb{background:#4fb3ff;color:#06203a}\n.note{text-align:center;color:var(--mut);font-size:12px;margin-top:16px}\n.rst{background:none;border:1px solid #2f7a55;color:var(--mut);border-radius:10px;padding:4px 10px;margin-top:6px}\n#fxm{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:99;border:0;background:#0006;color:#fff;border-radius:50%;width:34px;height:34px;font-size:16px}\n\n@keyframes pop{from{transform:translateY(-34px) rotateY(180deg) scale(.5);opacity:0}to{transform:none;opacity:1}}\n.joker{animation:fl .6s}@keyframes fl{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}\n#lA{transform:perspective(700px) rotateX(10deg);transform-origin:bottom}#lB{transform:perspective(700px) rotateX(-10deg);transform-origin:top}\n#wrap3{width:100%;margin:4px 0 8px}\n<\/style><\/head><body><div id=\"app\">\n<div class=\"top\">ANDAR <b>BAHAR<\/b><\/div>\n<div class=\"bal\">\ud83e\ude99 <span id=\"bal\">1000.00<\/span><\/div>\n<div id=\"wrap3\"><\/div><div style=\"display:none\"><div class=\"lane\" id=\"lA\"><h4>ANDAR<\/h4><div class=\"cards\" id=\"cA\"><\/div><\/div>\n<div class=\"mid\"><div class=\"joker back\" id=\"jk\">?<\/div><small>Joker ka rank jis side par pehle aaye, wahi jeetegi<\/small><\/div>\n<div class=\"lane\" id=\"lB\"><h4>BAHAR<\/h4><div class=\"cards\" id=\"cB\"><\/div><\/div>\n<\/div><div id=\"msg\" style=\"margin-top:12px\">Side chuno, card baantna shuru hoga<\/div>\n<div class=\"ctl\"><button onclick=\"adj(-10)\">\u2212<\/button><input id=\"amt\" type=\"number\" value=\"10\" min=\"1\"><button onclick=\"adj(10)\">+<\/button><button onclick=\"adj('h')\">\u00bd<\/button><button onclick=\"adj('d')\">2\u00d7<\/button><\/div>\n<div class=\"row\">\n <button class=\"bt\" id=\"bA\" onclick=\"play('A')\">ANDAR<small>pays 2x<\/small><\/button>\n <button class=\"bt\" id=\"bB\" onclick=\"play('B')\">BAHAR<small>pays 1.9x<\/small><\/button>\n<\/div>\n<div class=\"hist\" id=\"hist\"><\/div>\n<div class=\"note\">Ye sirf free-play game hai. Virtual coins hain, real paisa nahi.<br><button class=\"rst\" onclick=\"bal=1000;upd()\">Reset coins<\/button><\/div>\n<\/div>\n<button id=\"fxm\" onclick=\"this.textContent=FX.toggle()?'\ud83d\udd0a':'\ud83d\udd07'\">\ud83d\udd0a<\/button>\n<script>\nconst FX=(()=>{let ac,on=true;\nconst A=()=>{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume();return ac};\nfunction tone(f,d=.12,t='sine',v=.15,w=0,sl=0){if(!on)return;try{const a=A(),o=a.createOscillator(),g=a.createGain(),s=a.currentTime+w;o.type=t;o.frequency.setValueAtTime(f,s);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d)}catch(e){}}\nfunction noise(d=.3,v=.2,fc=1000){if(!on)return;try{const a=A(),n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),o=b.getCh i+200,200);x.stroke()}x.strokeStyle='#fff';x.lineWidth=6;x.strokeRect(3,3,134,194);return new THREE.CanvasTexture(cv)}\nlet BK=null;function mkCard(c){if(!BK)BK=cardBack();const g=new THREE.Group(),fm=new THREE.MeshBasicMaterial({map:c?cardFace(c):BK}),fr=new THREE.Mesh(new THREE.PlaneGeometry(.7,1),fm),bk=new THREE.Mesh(new THREE.PlaneGeometry(.7,1),new THREE.MeshBasicMaterial({map:BK}));fr.rotation.x=-Math.PI/2;fr.position.y=.004;bk.rotation.x=Math.PI/2;bk.position.y=-.004;g.add(fr,bk);return g}\nfunction ext(pts,d,m){const s=new THREE.Shape();s.moveTo(pts[0][0],pts[0][1]);pts.slice(1).forEach(p=>s.lineTo(p[0],p[1]));s.closePath();return new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:false}),m)}\nfunction buildJet(){const g=new THREE.Group(),yel=mat(0xffc400,{side:THREE.DoubleSide,metalness:.3}),body=mat(0xd5d9e3,{metalness:.6,roughness:.3});\n const fu=new THREE.Mesh(new THREE.CylinderGeometry(.2,.3,2.6,20),body);fu.rotation.z=-Math.PI/2;g.add(fu);\n const ns=new THREE.Mesh(new THREE.ConeGeometry(.2,.9,20),body);ns.rotation.z=-Math.PI/2;ns.position.x=1.75;g.add(ns);\n const w=ext([[.7,0],[-.9,1.9],[-1.3,1.9],[-1.1,0]],.07,yel);w.rotation.x=Math.PI/2;g.add(w);const w2=w.clone();w2.scale.y=-1;g.add(w2);\n const fin=ext([[-1.0,.1],[-1.45,1.0],[-1.8,1.0],[-1.5,.1]],.05,yel);fin.position.z=-.025;g.add(fin);\n const cp=new THREE.Mesh(new THREE.SphereGeometry(.22,18,12),mat(0x2b6cb0,{metalness:.9,roughness:.1}));cp.scale.set(1.8,.7,.8);cp.position.set(.6,.22,0);g.add(cp);\n const fl=new THREE.Mesh(new THREE.ConeGeometry(.15,1.1,12),new THREE.MeshBasicMaterial({color:0xff8a1f}));fl.rotation.z=Math.PI/2;fl.position.x=-2.2;g.add(fl);return g}\nconst SY=['\ud83c\udf52','\ud83c\udf52','\ud83c\udf52','\ud83c\udf52','\ud83c\udf52','\ud83c\udf4b','\ud83c\udf4b','\ud83c\udf4b','\ud83c\udf4b','\ud83c\udf47','\ud83c\udf47','\ud83c\udf47','\ud83d\udd14','\ud83d\udd14','\u2b50','\u2b50','7\ufe0f\u20e3'],PAY={'\ud83c\udf52':5,'\ud83c\udf4b':8,'\ud83c\udf47':10,'\ud8 ntListener('resize',rs);\n S.loop=f=>S.fns.push(f);\n S.go=(o,to,d,done,e)=>{const f={};for(const k in to)f[k]=o[k];S.tw.push({o,f,to,d,t0:performance.now(),done,e})};\n S.pick=(ev,objs)=>{const b=R.domElement.getBoundingClientRect();S.m.set((ev.clientX-b.left)/b.width*2-1,-((ev.clientY-b.top)/b.height)*2+1);S.ray.setFromCamera(S.m,cam);return S.ray.intersectObjects(objs,true)[0]};\n S.burst=(p,cols,n,sp)=>{for(let i=0;i<(n||40);i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.05+Math.random()*.08,6,6),new THREE.MeshBasicMaterial({color:cols[i%cols.length],transparent:true}));m.position.copy(p);sc.add(m);S.parts.push({m,v:new THREE.Vector3(Math.random()-.5,Math.random()*.8,Math.random()-.5).normalize().multiplyScalar((sp||4)*(.4+Math.random())),l:1})}};\n (function t(ts){requestAnimationFrame(t);const now=performance.now(),cur=S.tw;S.tw=[];\n  cur.forEach(a=>{const p=Math.min(1,(now-a.t0)/a.d),e=a.e?a.e(p):1-Math.pow(1-p,3);for(const k in a.to)a.o[k]=a.f[k]+(a.to[k]-a.f[k])*e;if(p<1)S.tw.push(a);else if(a.done)a.done()});\n  S.parts=S.parts.filter(q=>{q.m.position.addScaledVector(q.v,.016);q.v.y-=.1;q.l-=.018;q.m.material.opacity=Math.max(0,q.l);if(q.l<=0){sc.remove(q.m);return false}return true});\n  S.fns.forEach(f=>f(ts));cam.lookAt(S.la);R.render(sc,cam)})(0);\n return S}\nfunction cardFace(c){const cv=document.createElement('canvas');cv.width=140;cv.height=200;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,140,200);x.strokeStyle='#bbb';x.lineWidth=6;x.strokeRect(3,3,134,194);x.fillStyle=(c.s=='\u2665'||c.s=='\u2666')?'#d11a2a':'#111';x.textAlign='center';x.font='bold 64px system-ui';x.fillText(c.r,70,80);x.font='72px system-ui';x.fillText(c.s,70,160);return new THREE.CanvasTexture(cv)}\nfunction cardBack(){const cv=document.createElement('canvas');cv.width=140;cv.height=200;const x=cv.getContext('2d');x.fillStyle='#7a1630';x.fillRect(0,0,140,200);x.strokeStyle='#d8566f';x.lineWidth=3;for(let i=-200;i<340;i+=16){x.beginPath();x.moveTo(i,0);x.lineTo(i+200,200);x.stroke()}x.strokeStyle='#fff';x.lineWidth=6;x.strokeRect(3,3,134,194);return new THREE.CanvasTexture(cv)}\nlet BK=null;function mkCard(c){if(!BK)BK=cardBack();const g=new THREE.Group(),fm=new THREE.MeshBasicMaterial({map:c?cardFace(c):BK}),fr=new THREE.Mesh(new THREE.PlaneGeometry(.7,1),fm),bk=new THREE.Mesh(new THREE.PlaneGeometry(.7,1),new THREE.MeshBasicMaterial({map:BK}));fr.rotation.x=-Math.PI/2;fr.position.y=.004;bk.rotation.x=Math.PI/2;bk.position.y=-.004;g.add(fr,bk);return g}\nfunction ext(pts,d,m){const s=new THREE.Shape();s.moveTo(pts[0][0],pts[0][1]);pts.slice(1).forEach(p=>s.lineTo(p[0],p[1]));s.closePath();return new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:false}),m)}\nfunction buildJet(){const g=new THREE.Group(),yel=mat(0xffc400,{side:THREE.DoubleSide,metalness:.3}),body=mat(0xd5d9e3,{metalness:.6,roughness:.3});\n const fu=new THREE.Mesh(new THREE.CylinderGeometry(.2,.3,2.6,20),body);fu.rotation.z=-Math.PI/2;g.add(fu);\n const ns=new THREE.Mesh(new THREE.ConeGeometry(.2,.9,20),body);ns.rotation.z=-Math.PI/2;ns.position.x=1.75;g.add(ns);\n const w=ext([[.7,0],[-.9,1.9],[-1.3,1.9],[-1.1,0]],.07,yel);w.rotation.x=Math.PI/2;g.add(w);const w2=w.clone();w2.scale.y=-1;g.add(w2);\n const fin=ext([[-1.0,.1],[-1.45,1.0],[-1.8,1.0],[-1.5,.1]],.05,yel);fin.position.z=-.025;g.add(fin);\n const cp=new THREE.Mesh(new THREE.SphereGeometry(.22,18,12),mat(0x2b6cb0,{metalness:.9,roughness:.1}));cp.scale.set(1.8,.7,.8);cp.position.set(.6,.22,0);g.add(cp);\n const fl=new THREE.Mesh(new THREE.ConeGeometry(.15,1.1,12),new THREE.MeshBasicMaterial({color:0xff8a1f}));fl.rotation.z=Math.PI/2;fl.position.x=-2.2;g.add(fl);return g}\nlet busy=false,side=0;const S=mk3('c3',.72,45,[0,1.7,7],[0,1.3,-6]);\nconst pt=new THREE.Mesh(new THREE.PlaneGeometry(40,40),mat(0x1f8a3a,{roughness:.9}));pt.rotation.x=-Math.PI/2;S.sc.add(pt);\nconst wm=mat(0xffffff);[-3.6,3.6].forEach(x=>{const p=new THREE.Mesh(new THREE.BoxGeometry(.16,2.4,.16),wm);p.position.set(x,1.2,-8);S.sc.add(p)});\nconst cb=new THREE.Mesh(new THREE.BoxGeometry(7.4,.16,.16),wm);cb.position.set(0,2.4,-8);S.sc.add(cb);\nconst net=new THREE.Mesh(new THREE.PlaneGeometry(7.2,2.4),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.12,side:THREE.DoubleSide}));net.position.set(0,1.2,-8.5);S.sc.add(net);\nconst kp=new THREE.Group();const kb=new THREE.Mesh(new THREE.BoxGeometry(.7,1.1,.3),mat(0xff8a1f)),kh=new THREE.Mesh(new THREE.SphereGeometry(.22,14,12),mat(0xf1c9a5));kh.position.y=.8;\n[.5,-.5].forEach(x=>{const a=new THREE.Mesh(new THREE.BoxGeometry(.18,.8,.18),mat(0xff8a1f));a.position.set(x,.2,0);kp.add(a)});kb.position.y=.1;kp.add(kb,kh);kp.position.set(0,.65,-7.7);S.sc.add(kp);\nconst bl=new THREE.Mesh(new THREE.SphereGeometry(.22,18,18),mat(0xffffff,{roughness:.3}));bl.position.set(0,.22,3);S.sc.add(bl);\nfunction pk(s){if(busy)return;side=s;[-1,0,1].forEach((v,i)=>$('p'+i).classList.toggle('on',v==s))}\nfunction shoot(){if(busy)return;const a=getBet();if(!a)return;busy=true;$('go').disabled=true;bal-=a;upd();msg('');FX.click();\n const d=[-1,0,1][Math.floor(Math.random()*3)],saved=d==side,tx=side*2.6,ty=side==0?1.1:1.6;\n S.go(bl.position,{x:tx,y:ty,z:saved?-7.3:-8.3},600);S.go(kp.position,{x:d*2.3,y:d==0?.65:.45},420);S.go(kp.rotation,{z:-d*1.3},420);\n setTimeout(()=>{if(saved){FX.lose();msg('SAVED! \u2212'+f(a),'#ff7a88')}else{bal+=a*1.4;FX.win();S.burst(new THREE.Vector3(tx,ty,-8),[0xffd93b,0xffffff,0x4cc95a],50,4);msg('GOAL! +'+f(a*.4),'#3ddc7a')}hist(saved?'\u2716':'\u26bd',saved?'l':'w');upd()},750);\n setTimeout(()=>{S.go(bl.position,{x:0,y:.22,z:3},300);S.go(kp.position,{x:0,y:.65},300);S.go(kp.rotation,{z:0},300);busy=false;$('go').disabled=false},1900)}\nupd();\n<\/script><\/body><\/html>"}, "ludo": {"title": "Classic Ludo", "html": "<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Classic Ludo \u2013 Free Play<\/title>\n<style>\n:root{--bg:#14161f;--mut:#9aa0b5}\n*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}\nhtml,body{background:#000;color:#fff}\n#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);padding:env(safe-area-inset-top,0px) 10px calc(16px + env(safe-area-inset-bottom,0px))}\n.top{text-align:center;padding:14px 0 8px;font-size:22px;font-weight:800;letter-spacing:1px}.top b{color:#ffd93b}\n.board{position:relative;width:100%;aspect-ratio:1;background:#fff;border:4px solid #2a2d3a;border-radius:10px;overflow:hidden}\n.yd{position:absolute;width:40%;height:40%}.yi{position:absolute;inset:13%;background:#fff;border-radius:14px}\n.c{position:absolute;width:6.6667%;height:6.6667%;border:1px solid #b9bcc8;background:#fff;color:#777;font-size:11px;display:flex;align-items:center;justify-content:center}\n.ctr{position:absolute;left:40%;top:40%;width:20%;height:20%;background:conic-gradient(from 45deg,#fbc02d 0 90deg,#1e88e5 90deg 180deg,#e53935 180deg 270deg,#43a047 270deg 360deg)}\n.tk{position:absolute;width:5.2%;height:5.2%;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 2px 3px #000a;transition:left .3s,top .3s;z-index:3}\n.tk.can{z-index:5;cursor:pointer;animation:pl .5s infinite alternate}\n@keyframes pl{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-50%) scale(1.35)}}\n.panel{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}\n#turn{flex:1;font-weight:800;font-size:17px;line-height:1.3}\n#turn small{display:block;color:var(--mut);font-weight:500;font-size:13px;min-height:18px}\n.die{width:64px;height:64px;background:#fff;border-radius:12px;padding:8px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);box-shadow:0 4px 0 #bbb}\n.die i{border-radius:50%;margin:1px}.die i.on{background:#222}.die.roll{animation:sh .2s infinite}\n@keyframes sh{0%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}100%{transform:rotate(-12deg)}}\n#roll{border:0;border-radius:14px;padding:16px 22px;font-size:18px;font-weight:900;background:#ffd93b;color:#222}\n#roll:disabled{opacity:.35}\n.note{text-align:center;color:var(--mut);font-size:12px;margin-top:16px}\n.rst{background:none;border:1px solid #444a63;color:var(--mut);border-radius:10px;padding:5px 12px;margin-top:6px}\n#fxm{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:99;border:0;background:#0006;color:#fff;border-radius:50%;width:34px;height:34px;font-size:16px}\n\n.board{transform:perspective(900px) rotateX(20deg);transform-origin:center 65%;box-shadow:0 24px 30px #0009}\n.tk{box-shadow:inset -3px -4px 6px #0007,inset 3px 3px 5px #fff7,0 3px 4px #000a}\n#wrap3{width:100%;margin-top:4px}\n<\/style><\/head><body><div id=\"app\">\n<div class=\"top\">CLASSIC <b>LUDO<\/b><\/div>\n<div class=\"board\" id=\"bd\" style=\"display:none\"><\/div><div id=\"wrap3\"><\/div>\n<div class=\"panel\">\n <div id=\"turn\"><\/div>\n <div class=\"die\" id=\"die\"><\/div>\n <button id=\"roll\" onclick=\"rollDice()\">ROLL<\/button>\n<\/div>\n<div class=\"note\">Aap Red hain, baaki 3 bots hain. Ye free-play game hai, koi paisa nahi.<br><button class=\"rst\" onclick=\"reset()\">Naya game<\/button><\/div>\n<\/div>\n<button id=\"fxm\" onclick=\"this.textContent=FX.toggle()?'\ud83d\udd0a':'\ud83d\udd07'\">\ud83d\udd0a<\/button>\n<script>\nconst FX=(()=>{let ac,on=true;\nconst A=()=>{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume();return ac};\nfunction tone(f,d=.12,t='sine',v=.15,w=0,sl=0){if(!on)return;try{const a=A(),o=a.createOscillator(),g=a.createGain(),s=a.currentTime+w;o.type=t;o.frequency.setValueAtTime(f,s);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d)}catch(e){}}\nfunction noise(d=.3,v=.2,fc=1000){if(! .seg(9,6,1,0,6),...seg(14,7,0,1,2),...seg(13,8,-1,0,5),...seg(8,9,0,1,6),...seg(7,14,-1,0,2),...seg(6,13,0,-1,5),...seg(5,8,-1,0,6),...seg(0,7,0,-1,2)];\nconst HC=[seg(1,7,1,0,5),seg(7,1,0,1,5),seg(13,7,-1,0,5),seg(7,13,0,-1,5)];\nconst ST=[0,13,26,39],SAFE=[0,8,13,21,26,34,39,47];\nconst COL=['#e53935','#43a047','#fbc02d','#1e88e5'],LIGHT=['#f6b3b1','#b5dcb7','#fde8a0','#a9cdf3'],NM=['Red (aap)','Green','Yellow','Blue'];\nconst YO=[[0,0],[9,0],[9,9],[0,9]];\nlet P,turn,roll,phase,over,tks=[];\nconst abs=(pl,p)=>(ST[pl]+p)%52;\nfunction build(){let h='';\n YO.forEach((o,i)=>h+=`<div class=\"yd\" style=\"left:${o[0]/15*100}%;top:${o[1]/15*100}%;background:${COL[i]}\"><div class=\"yi\"><\/div><\/div>`);\n PATH.forEach((c,k)=>{const si=ST.indexOf(k);const bg=si>=0?COL[si]:'#fff';\n  h+=`<div class=\"c\" style=\"left:${c[0]/15*100}%;top:${c[1]/15*100}%;background:${bg}\">${si<0&&SAFE.includes(k)?'\u2605':''}<\/div>`;});\n HC.forEach((a,i)=>a.forEach(c=>h+=`<div class=\"c\" style=\"left:${c[0]/15*100}%;top:${c[1]/15*100}%;background:${COL[i]}\"><\/div>`));\n h+='<div class=\"ctr\"><\/div>';$('bd').innerHTML=h;\n tks=[];for(let pl=0;pl<4;pl++)for(let i=0;i<4;i++){const t=document.createElement('div');t.className='tk';t.style.background=COL[pl];t.onclick=()=>{if(phase=='pick'&&pl==0&&t.classList.contains('can'))move(i)};$('bd').appendChild(t);tks.push(t);}}\nfunction xy(pl,i){const p=P[pl][i];\n if(p==-1){const o=YO[pl];return[o[0]+(i%2?4:2),o[1]+(i<2?2:4)];}\n if(p<=50){const c=PATH[abs(pl,p)];return[c[0]+.5,c[1]+.5];}\n if(p<=55){const c=HC[pl][p-51];return[c[0]+.5,c[1]+.5];}\n return[[6.6,7.5],[7.5,6.6],[8.4,7.5],[7.5,8.4]][pl].map((v,k)=>v+(k?-1:1)*(i-1.5)*.08);}\nfunction render(){const seen={};\n for(let pl=0;pl<4;pl++)for(let i=0;i<4;i++){const [x,y]=xy(pl,i),k=x.toFixed(1)+','+y.toFixed(1);const n=seen[k]=(seen[k]||0)+1;\n  const t=tks[pl*4+i];t.style.left=((x+(n-1)*.18)/15*100)+'%';t.style.top=((y-(n-1)*.18)/15*100)+'%';}}\nfunction face(n){const PP={1:[4],2:[0,8]
