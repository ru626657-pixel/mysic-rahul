.remove()})()}\nfunction banner(){if(!document.getElementById('fxs')){const s=document.createElement('style');s.id='fxs';s.textContent='@keyframes fxb{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}@keyframes fxc{to{transform:translateY(110vh) rotate(360deg)}}';document.head.appendChild(s)}\n const b=document.createElement('div');b.textContent='\ud83c\udf89 WIN!';b.style.cssText='position:fixed;left:50%;top:38%;z-index:97;font:900 44px system-ui;color:#ffd93b;text-shadow:0 3px 0 #a85a00,0 0 20px #ffb300;pointer-events:none;animation:fxb 1.4s ease-out forwards';document.body.appendChild(b);setTimeout(()=>b.remove(),1500);\n for(let i=0;i<14;i++){const c=document.createElement('div');c.textContent='\ud83e\ude99';c.style.cssText='position:fixed;top:-30px;left:'+Math.random()*100+'vw;font-size:'+(18+Math.random()*16)+'px;z-index:96;pointer-events:none;animation:fxc '+(1.2+Math.random())+'s linear '+Math.random()*.4+'s forwards';document.body.appendChild(c);setTimeout(()=>c.remove(),2800)}}\nconst SC=[0,2,4,7,9,12,14,16],nt=n=>220*Math.pow(2,n/12);\nfunction mstep(){if(!on||!mu)return;const n=SC[Math.floor(Math.random()*SC.length)];tone(nt(n),.5,'triangle',.02);if(st%4==0)tone(nt(SC[(st/4|0)%4]-12),.9,'sine',.03);st++}\naddEventListener('pointerdown',()=>{if(mu&&!tm){try{A()}catch(e){}tm=setInterval(mstep,420)}},{once:true});\naddEventListener('message',e=>{const d=e.data;if(d&&d.t=='wallet'&&typeof d.v=='number'){try{bal=d.v;lastBal=d.v;if(typeof upd=='function')upd()}catch(x){}}});\nsetInterval(()=>{try{if(typeof bal=='number'&&bal!==lastBal){lastBal=bal;post({t:'bal',v:bal})}}catch(e){}try{if(typeof best=='number'&&best>0&&best!==lastBest){lastBest=best;post({t:'best',v:best})}}catch(e){}},400);\npost({t:'ready'});\nreturn{tone,noise,click(){tone(520,.06,'square',.06);tone(780,.05,'sine',.05,.02)},tick(){tone(900,.03,'square',.04)},\nro lineTo(i+200,200);x.stroke()}x.strokeStyle='#fff';x.lineWidth=6;x.strokeRect(3,3,134,194);return new THREE.CanvasTexture(cv)}\nlet BK=null;function mkCard(c){if(!BK)BK=cardBack();const g=new THREE.Group(),fm=new THREE.MeshBasicMaterial({map:c?cardFace(c):BK}),fr=new THREE.Mesh(new THREE.PlaneGeometry(.7,1),fm),bk=new THREE.Mesh(new THREE.PlaneGeometry(.7,1),new THREE.MeshBasicMaterial({map:BK}));fr.rotation.x=-Math.PI/2;fr.position.y=.004;bk.rotation.x=Math.PI/2;bk.position.y=-.004;g.add(fr,bk);return g}\nfunction ext(pts,d,m){const s=new THREE.Shape();s.moveTo(pts[0][0],pts[0][1]);pts.slice(1).forEach(p=>s.lineTo(p[0],p[1]));s.closePath();return new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:false}),m)}\nfunction buildJet(){const g=new THREE.Group(),yel=mat(0xffc400,{side:THREE.DoubleSide,metalness:.3}),body=mat(0xd5d9e3,{metalness:.6,roughness:.3});\n const fu=new THREE.Mesh(new THREE.CylinderGeometry(.2,.3,2.6,20),body);fu.rotation.z=-Math.PI/2;g.add(fu);\n const ns=new THREE.Mesh(new THREE.ConeGeometry(.2,.9,20),body);ns.rotation.z=-Math.PI/2;ns.position.x=1.75;g.add(ns);\n const w=ext([[.7,0],[-.9,1.9],[-1.3,1.9],[-1.1,0]],.07,yel);w.rotation.x=Math.PI/2;g.add(w);const w2=w.clone();w2.scale.y=-1;g.add(w2);\n const fin=ext([[-1.0,.1],[-1.45,1.0],[-1.8,1.0],[-1.5,.1]],.05,yel);fin.position.z=-.025;g.add(fin);\n const cp=new THREE.Mesh(new THREE.SphereGeometry(.22,18,12),mat(0x2b6cb0,{metalness:.9,roughness:.1}));cp.scale.set(1.8,.7,.8);cp.position.set(.6,.22,0);g.add(cp);\n const fl=new THREE.Mesh(new THREE.ConeGeometry(.15,1.1,12),new THREE.MeshBasicMaterial({color:0xff8a1f}));fl.rotation.z=Math.PI/2;fl.position.x=-2.2;g.add(fl);return g}\nlet mines=3,grid=[],open=[],active=false,bet=0,k=0;\nconst S=mk3('c3',.95,42,[0,7.5,6.6],[0,0,.3]),tl=[];\nfor(let i=0;i<25;i++){const g=new THREE.Group(),r=Math.floor(i/5),c=i%5;g.position.set((c-2)*1.15,0,(r-2)*1.15);\n const b=new THREE.Mesh(new THREE.BoxGeometry(1,.4,1),mat(0x2a8a9a));b.userData.i=i;g.add o ya cashout!');draw();upd2();return}\n if(Math.random()<FAIL){dead=true;FX.splash();setTimeout(()=>FX.lose(),150);draw();msg('Splash! Frog paani me gir gaya \u2212'+f(bet),'#ff7a88');end(false);return}\n pos++;FX.hop();draw();if(pos==N){FX.win();bal+=bet*MU[pos];S.burst(fg.position.clone(),[0xffd93b,0xffffff],40,4);msg('Paar ho gaye! +'+f(bet*MU[pos]-bet),'#3ddc7a');end(true);return}upd2()}\nfunction cash(){if(!active||pos<1)return;const w=bet*MU[pos];bal+=w;FX.win();msg('Cashout! +'+f(w-bet),'#3ddc7a');end(true)}\n$('amt').addEventListener('input',upd2);draw();upd2();\n<\/script><\/body><\/html>"}, "andar": {"title": "Andar Bahar", "html": "<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Andar Bahar \u2013 Free Play<\/title>\n<style>\n:root{--bg:#0b2a1c;--y:#ffd93b;--mut:#8fc4a6}\n*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}\nhtml,body{background:#000;color:#fff}\n#app{max-width:430px;margin:0 auto;min-height:100vh;background:radial-gradient(circle at 50% 30%,#14663f,var(--bg) 70%);padding:env(safe-area-inset-top,0px) 12px calc(18px + env(safe-area-inset-bottom,0px))}\n.top{text-align:center;padding:16px 0 8px;font-size:22px;font-weight:800;letter-spacing:1px}.top b{color:var(--y)}\n.bal{margin:6px auto 12px;width:max-content;background:#0007;border-radius:20px;padding:7px 18px;font-weight:700}\n.lane{background:#0a3a24;border:2px solid #1c7a4c;border-radius:16px;padding:8px;min-height:92px;position:relative}\n.lane h4{font-size:12px;letter-spacing:2px;color:var(--mut);margin-bottom:4px}\n.lane.win{border-color:var(--y);box-shadow:0 0 18px #ffd93b88}\n.cards{display:flex;flex-wrap:wrap;gap:3px}\n.card{width:30px;height:42px;background:#fff;border-radius:5px;color:#111;font-weight:800;font-size:12px;line-height:1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:pop .25s ease- class=\"bt\" id=\"bB\" onclick=\"play('B')\">BAHAR<small>pays 1.9x<\/small><\/button>\n<\/div>\n<div class=\"hist\" id=\"hist\"><\/div>\n<div class=\"note\">Ye sirf free-play game hai. Virtual coins hain, real paisa nahi.<br><button class=\"rst\" onclick=\"bal=1000;upd()\">Reset coins<\/button><\/div>\n<\/div>\n<button id=\"fxm\" onclick=\"this.textContent=FX.toggle()?'\ud83d\udd0a':'\ud83d\udd07'\">\ud83d\udd0a<\/button><button id=\"mus\" onclick=\"this.style.opacity=FX.music()?1:.4\">\ud83c\udfb5<\/button>\n<script>\nconst FX=(()=>{let ac,on=true,mu=true,mg,tm=null,st=0,lastBal=null,lastBest=null;\nconst post=o=>{try{parent.postMessage(o,'*')}catch(e){}};\nconst A=()=>{if(!ac){const C=window.AudioContext||window.webkitAudioContext;ac=new C();mg=ac.createGain();mg.gain.value=.9;const d=ac.createDelay(.5),fb=ac.createGain(),wet=ac.createGain();d.delayTime.value=.16;fb.gain.value=.28;wet.gain.value=.22;mg.connect(ac.destination);mg.connect(d);d.connect(fb);fb.connect(d);d.connect(wet);wet.connect(ac.destination)}if(ac.state=='suspended')ac.resume();return ac};\nfunction tone(f,d,t,v,w,sl){if(!on)return;try{const a=A(),o=a.createOscillator(),g=a.createGain(),s=a.currentTime+(w||0);o.type=t||'sine';o.frequency.setValueAtTime(f,s);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),s+d);g.gain.setValueAtTime(.0001,s);g.gain.linearRampToValueAtTime(v||.15,s+.012);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(mg);o.start(s);o.stop(s+d+.02)}catch(e){}}\nfunction noise(d,v,fc){if(!on)return;try{const a=A(),n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),o=b.getChannelData(0);for(let i=0;i<n;i++)o[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=fc||1000;const g=a.createGain();g.gain.value=v||.2;s.connect(f);f.connect(g);g.connect(mg);s.start()}catch(e){}}\nfunction confetti(){const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:98';document.body.appendChild(c);c.width=innerWidth;c.height=innerHeight;const x=c.getContext('2d'),P=Array.from({length:110},()=>({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,r:Math.random()*6+3,c:'hsl('+Math.random()*360+',90%,60%)',a:Math.random()*6,s:Math.random()<.5}));let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);if(p.s){x.beginPath();x.arc(0,0,p.r/1.5,0,7);x.fill()}else x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});if(++t<120)requestAnimationFrame(f);else c.remove()})()}\nfunction banner(){if(!document.getElementById('fxs')){const s=document.createElement('style');s.id='fxs';s.textContent='@keyframes fxb{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}@keyframes fxc{to{transform:translateY(110vh) rotate(360deg)}}';document.head.appendChild(s)}\n const b=document.createElement('div');b.textContent='\ud83c\udf89 WIN!';b.style.cssText='position:fixed;left:50%;top:38%;z-index:97;font:900 44px system-ui;color:#ffd93b;text-shadow:0 3px 0 #a85a00,0 0 20px #ffb300;pointer-events:none;animation:fxb 1.4s ease-out forwards';document.body.appendChild(b);setTimeout(()=>b.remove(),1500);\n for(let i=0;i<14;i++){const c=document.createElement('div');c.textContent='\ud83e\ude99';c.style.cssText='position:fixed;top:-30px;left:'+Math.random()*100+'vw;font-size:'+(18+Math.random()*16)+'px;z-index:96;pointer-events:none;animation:fxc '+(1.2+Math.random())+'s linear '+Math.random()*.4+'s forwards';document.body.appendChild(c);setTimeout(()=>c.remove(),2800)}}\nconst SC=[0,2,4,7,9,12,14,16],nt=n=>220*Math.pow(2,n/12);\nfunction mstep(){if(!on||!mu)return;const n=SC[Math.floor(Math.random()*SC.length)];tone(nt(n),.5,'trian n true});\n  S.fns.forEach(f=>f(ts));cam.lookAt(S.la);R.render(sc,cam)})(0);\n return S}\nfunction cardFace(c){const cv=document.createElement('canvas');cv.width=140;cv.height=200;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,140,200);x.strokeStyle='#bbb';x.lineWidth=6;x.strokeRect(3,3,134,194);x.fillStyle=(c.s=='\u2665'||c.s=='\u2666')?'#d11a2a':'#111';x.textAlign='center';x.font='bold 64px system-ui';x.fillText(c.r,70,80);x.font='72px system-ui';x.fillText(c.s,70,160);return new THREE.CanvasTexture(cv)}\nfunction cardBack(){const cv=document.createElement('canvas');cv.width=140;cv.height=200;const x=cv.getContext('2d');x.fillStyle='#7a1630';x.fillRect(0,0,140,200);x.strokeStyle='#d8566f';x.lineWidth=3;for(let i=-200;i<340;i+=16){x.beginPath();x.moveTo(i,0);x.lineTo(i+200,200);x.stroke()}x.strokeStyle='#fff';x.lineWidth=6;x.strokeRect(3,3,134,194);return new THREE.CanvasTexture(cv)}\nlet BK=null;function mkCard(c){if(!BK)BK=cardBack();const g=new THREE.Group(),fm=new THREE.MeshBasicMaterial({map:c?cardFace(c):BK}),fr=new THREE.Mesh(new THREE.PlaneGeometry(.7,1),fm),bk=new THREE.Mesh(new THREE.PlaneGeometry(.7,1),new THREE.MeshBasicMaterial({map:BK}));fr.rotation.x=-Math.PI/2;fr.position.y=.004;bk.rotation.x=Math.PI/2;bk.position.y=-.004;g.add(fr,bk);return g}\nfunction ext(pts,d,m){const s=new THREE.Shape();s.moveTo(pts[0][0],pts[0][1]);pts.slice(1).forEach(p=>s.lineTo(p[0],p[1]));s.closePath();return new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:false}),m)}\nfunction buildJet(){const g=new THREE.Group(),yel=mat(0xffc400,{side:THREE.DoubleSide,metalness:.3}),body=mat(0xd5d9e3,{metalness:.6,roughness:.3});\n const fu=new THREE.Mesh(new THREE.CylinderGeometry(.2,.3,2.6,20),body);fu.rotation.z=-Math.PI/2;g.add(fu);\n const ns=new THREE.Mesh(new THREE.ConeGeometry(.2,.9,20),body);ns.rotation.z=-Math.PI/2;ns.position.x=1.75;g.add(ns);\n const w=ext([[.7,0],[-.9,1.9],[-1.3,1.9],[-1.1,0]],.07,yel);w.rotation.x=Math.PI/2;g.add(w);const w2 orEach(px=>{const p=new THREE.Mesh(new THREE.BoxGeometry(.56,2.3,.9),stone);p.position.set(px,1.15,0);g.add(p)});\n const a=new THREE.Mesh(new THREE.TorusGeometry(1.15,.28,12,32,Math.PI),stone);a.position.y=2.3;g.add(a);\n const sh=new THREE.Shape();sh.moveTo(-1.15,0);sh.lineTo(1.15,0);sh.lineTo(1.15,2.3);sh.absarc(0,2.3,1.15,0,Math.PI,false);sh.lineTo(-1.15,0);const op=new THREE.Mesh(new THREE.ShapeGeometry(sh),new THREE.MeshBasicMaterial({color:0x1a1236}));op.position.z=-.3;g.add(op);\n const bg=new THREE.Group();bg.position.z=.2;for(let i=0;i<5;i++){const c=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,3.3,8),mat(0x8a909c,{metalness:.8,roughness:.35}));c.position.set(-.92+i*.46,1.65,0);bg.add(c)}\n [.8,1.8,2.8].forEach(y=>{const r=new THREE.Mesh(new THREE.BoxGeometry(2.3,.08,.08),mat(0x8a909c,{metalness:.8,roughness:.35}));r.position.y=y;bg.add(r)});g.add(bg);g.userData.bars=bg;\n const pt=new THREE.Mesh(new THREE.BoxGeometry(1.4,.08,.6),mat(0x6a4cc0,{roughness:.5}));pt.position.set(0,.05,1.5);g.add(pt);\n const bd=mkBadge();g.add(bd);badges[k]=bd;shd(g);S.sc.add(g);gates[k]=g}\nconst pip=new THREE.Group(),pb=new THREE.Group();pip.add(pb);const yl=mat(0xffd23a,{roughness:.5}),or=mat(0xff8a1f,{roughness:.5});\nconst bd=new THREE.Mesh(new THREE.SphereGeometry(.5,24,18),yl);bd.scale.set(1,1.05,.95);bd.position.y=.62;pb.add(bd);\nconst bl=new THREE.Mesh(new THREE.SphereGeometry(.34,18,14),mat(0xffeaa0,{roughness:.6}));bl.position.set(0,.5,-.2);bl.scale.set(1,1.1,.7);pb.add(bl);\nconst bk=new THREE.Mesh(new THREE.ConeGeometry(.12,.3,12),or);bk.rotation.x=-Math.PI/2;bk.position.set(0,.66,-.55);pb.add(bk);\n[.17,-.17].forEach(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.12,12,12),mat(0xffffff));e.position.set(x,.84,-.38);const q=new THREE.Mesh(new THREE.SphereGeometry(.06,10,10),mat(0x111111));q.position.set(x,.84,-.48);const w=new THREE.Mesh(new THREE.SphereGeometry(.2,12,10),yl);w.scale.set(.35,1,1.2);w.position.set(x*3,.6,0);const f2=new THREE.Mesh(new THREE.BoxGeometry(.16,.08,.3),or);f2.position.set(x*1.2,.04,-.1);pb.add(e,q,w,f2)});\n[-.12,0,.12].forEach(x=>{const t=new THREE.Mesh(new THREE.ConeGeometry(.06,.25,8),or);t.position.set(x,1.2,0);t.rotation.z=x*-2;pb.add(t)});\nshd(pip);pip.rotation.y=Math.PI;pip.scale.set(BS,BS,BS);pip.position.set(SP,0,1.5);S.sc.add(pip);\nS.loop(ts=>{pb.position.y=active&&!busy?Math.abs(Math.sin(ts/220))*.06:Math.sin(ts/400)*.03});\nfunction ren(){for(let k=1;k<=N;k++){const st=k<=pos?0:k==pos+1?1:2;if(badges[k].userData.st!==st){badges[k].userData.st=st;setBadge(k,st)}}}\nfunction view(x){S.go(S.cam.position,{x:x},500);S.go(S.la,{x:x},500)}\nfunction ui(){$('cv').textContent=f(active&&pos?bet*MU(pos):0);$('cash').disabled=!(active&&pos>0&&!busy);$('go').disabled=busy;upd()}\nfunction reset(){gates.forEach(g=>{if(g)g.userData.bars.position.y=0});pip.position.set(SP,0,1.5);pip.scale.set(BS,BS,BS);pos=0;ren();view(SP)}\nfunction setAmt(v,el){$('amt').value=v;$('ad').textContent=(+v).toFixed(2);if(el)document.querySelectorAll('.ch').forEach(x=>x.classList.toggle('on',x==el));else document.querySelectorAll('.ch').forEach(x=>x.classList.remove('on'))}\nfunction go(){if(busy)return;\n if(!active){const a=getBet();if(!a)return;FX.coin();bet=a;bal-=a;upd();reset();active=true;msg('Dash karte raho ya cashout!')}\n busy=true;ui();const k=pos+1,bars=gates[k].userData.bars;FX.hop();\n if(Math.random()>P){S.go(bars.position,{y:3.2},260);S.go(pip.position,{z:.1},320,()=>S.go(bars.position,{y:0},100,()=>{FX.boom();FX.lose();pip.scale.set(BS*1.4,BS*.15,BS*1.4);S.burst(pip.position.clone().setY(.7),[0xffd23a,0xffeaa0,0xffffff],60,4);active=false;msg('Gate band ho gaya! \u2212'+f(bet),'#ff7a88');hist('\u2716','l');setTimeout(()=>{busy=false;ui()},600)}));return}\n S.go(bars.position,{y:3.2},260);\n S.go(pip.position,{z:-.2},330,()=>{S.go(bars.position,{y:0},200);\n  if(k==N){pos=k;ren();FX.coin();busy=false;cash();return}\n  S.go(pip.position,{x:SP*(k+1),z:1.5},420,()=>{pos=k;ren();FX.coin();busy=fa eateGain(),wet=ac.createGain();d.delayTime.value=.16;fb.gain.value=.28;wet.gain.value=.22;mg.connect(ac.destination);mg.connect(d);d.connect(fb);fb.connect(d);d.connect(wet);wet.connect(ac.destination)}if(ac.state=='suspended')ac.resume();return ac};\nfunction tone(f,d,t,v,w,sl){if(!on)return;try{const a=A(),o=a.createOscillator(),g=a.createGain(),s=a.currentTime+(w||0);o.type=t||'sine';o.frequency.setValueAtTime(f,s);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),s+d);g.gain.setValueAtTime(.0001,s);g.gain.linearRampToValueAtTime(v||.15,s+.012);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(mg);o.start(s);o.stop(s+d+.02)}catch(e){}}\nfunction noise(d,v,fc){if(!on)return;try{const a=A(),n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),o=b.getChannelData(0);for(let i=0;i<n;i++)o[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=fc||1000;const g=a.createGain();g.gain.value=v||.2;s.connect(f);f.connect(g);g.connect(mg);s.start()}catch(e){}}\nfunction confetti(){const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:98';document.body.appendChild(c);c.width=innerWidth;c.height=innerHeight;const x=c.getContext('2d'),P=Array.from({length:110},()=>({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,r:Math.random()*6+3,c:'hsl('+Math.random()*360+',90%,60%)',a:Math.random()*6,s:Math.random()<.5}));let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);if(p.s){x.beginPath();x.arc(0,0,p.r/1.5,0,7);x.fill()}else x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});if(++t<120)requestAnimationFrame(f);else c.remove()})()}\nfunction banner(){if(!document.getElementById('fxs')){const s=document.createElement('style');s.id='fxs';s.t ents:none;z-index:98';document.body.appendChild(c);c.width=innerWidth;c.height=innerHeight;const x=c.getContext('2d'),P=Array.from({length:110},()=>({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,r:Math.random()*6+3,c:'hsl('+Math.random()*360+',90%,60%)',a:Math.random()*6,s:Math.random()<.5}));let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);if(p.s){x.beginPath();x.arc(0,0,p.r/1.5,0,7);x.fill()}else x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});if(++t<120)requestAnimationFrame(f);else c.remove()})()}\nfunction banner(){if(!document.getElementById('fxs')){const s=document.createElement('style');s.id='fxs';s.textContent='@keyframes fxb{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}@keyframes fxc{to{transform:translateY(110vh) rotate(360deg)}}';document.head.appendChild(s)}\n const b=document.createElement('div');b.textContent='\ud83c\udf89 WIN!';b.style.cssText='position:fixed;left:50%;top:38%;z-index:97;font:900 44px system-ui;color:#ffd93b;text-shadow:0 3px 0 #a85a00,0 0 20px #ffb300;pointer-events:none;animation:fxb 1.4s ease-out forwards';document.body.appendChild(b);setTimeout(()=>b.remove(),1500);\n for(let i=0;i<14;i++){const c=document.createElement('div');c.textContent='\ud83e\ude99';c.style.cssText='position:fixed;top:-30px;left:'+Math.random()*100+'vw;font-size:'+(18+Math.random()*16)+'px;z-index:96;pointer-events:none;animation:fxc '+(1.2+Math.random())+'s linear '+Math.random()*.4+'s forwards';document.body.appendChild(c);setTimeout(()=>c.remove(),2800)}}\nconst SC=[0,2,4,7,9,12,14,16],nt=n=>220*Math.pow(2,n/12);\nfunction mstep(){if(!on||!mu)return;const n=SC[Math.floor(Math.random()*SC.length)];tone(nt(n),.5,'triangle',.02);if(st%4==0)tone(nt(SC[(st/4|0)%4]-12),.9,'sin let W=Object.assign({bal:1000,xp:0,wins:0,losses:0,plays:0,games:[],last:'',ach:[],lv:1,best:{}},ld('gz_w',{}));let cur=null;
const lvl=x=>Math.floor(Math.sqrt(x/40))+1;
const ACH=[{id:'w1',t:'🏆 Pehli Jeet',c:()=>W.wins>=1},{id:'w10',t:'🔥 10 Jeet',c:()=>W.wins>=10},{id:'w50',t:'👑 50 Jeet',c:()=>W.wins>=50},{id:'g5',t:'🧭 5 alag games khele',c:()=>W.games.length>=5},{id:'g15',t:'🌍 15 alag games khele',c:()=>W.games.length>=15},{id:'l5',t:'⭐ Level 5',c:()=>lvl(W.xp)>=5},{id:'rich',t:'💰 5000 coins',c:()=>W.bal>=5000},{id:'hs',t:'🎯 Pehla High Score',c:()=>Object.keys(W.best).length>=1}];
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2700)}
function wbar(){const L=lvl(W.xp),b0=40*(L-1)*(L-1),b1=40*L*L,p=Math.min(100,(W.xp-b0)/(b1-b0)*100);return '<div class="wl"><div class="lv"><b id="lvn">Lv '+L+' · '+W.xp+' XP</b><div class="xb"><i id="xbi" style="width:'+p+'%"></i></div></div><div class="cn">🪙 <b id="wb">'+Math.floor(W.bal)+'</b></div><button class="dbn" onclick="daily()">🎁</button></div>'}
function wui(){const a=document.getElementById('wb');if(a)a.textContent=Math.floor(W.bal);const L=lvl(W.xp),b0=40*(L-1)*(L-1),b1=40*L*L,l=document.getElementById('lvn'),x=document.getElementById('xbi');if(l)l.textContent='Lv '+L+' · '+W.xp+' XP';if(x)x.style.width=Math.min(100,(W.xp-b0)/(b1-b0)*100)+'%'}
function wsave(){sv('gz_w',W);wui()}
function checkAch(){ACH.forEach(a=>{if(!W.ach.includes(a.id)&&a.c()){W.ach.push(a.id);W.xp+=25;toast('🏅 '+a.t+' unlock!')}})}
function gain(x){W.xp+=x;const L=lvl(W.xp);if(L>W.lv){W.lv=L;toast('⬆️ Level '+L+' ho gaya!')}checkAch();wsave()}
function trackPlay(k){W.plays++;if(!W.games.includes(k))W.games.push(k);gain(2)}
function daily(){const t=new Date().toDateString();if(W.last==t){toast('Aaj ka bonus le liya. Kal phir aana!');return}W.last=t;W.bal+=500;toast('🎁 Daily bonus +500 coins!');gain(20);if(view!='home')render();else wui()}
function refill(){if(W.bal<50){W.bal=200;toast('💸 200 coins mil gaye');wsave();render()}else toast('Abhi coins kaafi hain')}
function meView(){const L=lvl(W.xp),hs=Object.keys(W.best).map(k=>{const m=by(k);return m?'<div>'+m.ic+' '+m.nm+': <b>'+W.best[k]+'</b></div>':''}).join('')||'Abhi koi high score nahi';
 return '<div class="me"><h3>👤 Aapki Profile</h3>Level '+L+' · XP '+W.xp+'<br>🪙 Coins: '+Math.floor(W.bal)+'<br>Jeet: '+W.wins+' · Haar: '+W.losses+'<br>Games khele: '+W.games.length+'/'+META.length+'</div><div class="me"><h3>🏅 Achievements</h3>'+ACH.map(a=>'<div style="opacity:'+(W.ach.includes(a.id)?1:.4)+'">'+(W.ach.includes(a.id)?'✅ ':'🔒 ')+a.t+'</div>').join('')+'</div><div class="me"><h3>🎯 High Scores</h3>'+hs+'</div><div class="me"><button class="dbn2" onclick="daily()">🎁 Daily Bonus +500</button><button class="dbn2" onclick="refill()">💸 Refill (coins &lt; 50)</button><br><br>Saare games free-play hain. Coins virtual hain aur sab games me ek hi wallet chalta hai.</div>'}
addEventListener('message',e=>{const d=e.data;if(!d||typeof d!='object')return;
 if(d.t=='ready'){try{e.source.postMessage({t:'wallet',v:W.bal},'*')}catch(x){}}
 else if(d.t=='bal'&&typeof d.v=='number'){W.bal=d.v;checkAch();wsave()}
 else if(d.t=='win'){W.wins++;gain(12)}else if(d.t=='lose'){W.losses++;gain(3)}
 else if(d.t=='best'&&typeof d.v=='number'&&cur){if(d.v>(W.best[cur]||0)){W.best[cur]=d.v;toast('🏆 Naya High Score: '+d.v);gain(10)}}});
render();
</script></body></html>
